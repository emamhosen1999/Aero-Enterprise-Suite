<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBEDC Guardian - Offline</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.8);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      background: rgba(2, 132, 199, 0.15);
      border: 2px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--primary);
    }

    .logo-badge svg {
      width: 36px;
      height: 36px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .server-info {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .server-info span {
      color: var(--primary);
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a5 5 0 010-7.072m0 0l2.829 2.829m-4.243-2.829L3 3m5.636 5.636a9 9 0 0112.728 0"></path>
      </svg>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      Connection Offline
    </div>

    <h1>Unable to Connect to Server</h1>
    <p>Please check your internet connection or verify if the DBEDC Guardian server is running.</p>

    <div class="server-info">
      Target Endpoint: <span id="current-url">http://erp.dhakabypass.com</span>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="retry-btn">Try Reconnecting</button>
      <button class="btn-secondary" id="settings-btn">Configure Server Endpoint</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.electronAPI) {
        const url = await window.electronAPI.getServerUrl();
        document.getElementById('current-url').textContent = url;
      }

      document.getElementById('retry-btn').addEventListener('click', () => {
        if (window.electronAPI) {
          window.electronAPI.reloadApp();
        } else {
          window.location.reload();
        }
      });

      document.getElementById('settings-btn').addEventListener('click', () => {
        if (window.electronAPI) {
          window.electronAPI.openSettings();
        }
      });
    });
  </script>
</body>
</html>
